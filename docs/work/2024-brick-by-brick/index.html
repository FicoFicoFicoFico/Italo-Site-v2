
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>brick by brick — Ítalo Carajá</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/assets/css/project-viewer.css">
    <script src="/assets/js/project-viewer.js" defer></script>
</head>

<body>
<main class="project-viewer">

    <div class="viewer-gallery">

        <div class="viewer-image-area">

            
                <figure class="viewer-slide"
                        data-slide="0"
                        >

                    <img
                        src="/projects/2024/brick_by_brick/70-brick-by-brick.webp"
                        alt="brick by brick — image 1"
                        
                            loading="eager"
                        
                    >

                </figure>
            
                <figure class="viewer-slide"
                        data-slide="1"
                        hidden>

                    <img
                        src="/projects/2024/brick_by_brick/71-brick-by-brick.webp"
                        alt="brick by brick — image 2"
                        
                            loading="lazy"
                        
                    >

                </figure>
            
                <figure class="viewer-slide"
                        data-slide="2"
                        hidden>

                    <img
                        src="/projects/2024/brick_by_brick/brick-by-brick-2.webp"
                        alt="brick by brick — image 3"
                        
                            loading="lazy"
                        
                    >

                </figure>
            
                <figure class="viewer-slide"
                        data-slide="3"
                        hidden>

                    <img
                        src="/projects/2024/brick_by_brick/brick-by-brick-1.webp"
                        alt="brick by brick — image 4"
                        
                            loading="lazy"
                        
                    >

                </figure>
            

        </div>

        <div class="viewer-controls">

            <button id="previous-image"
                    type="button"
                    aria-label="Previous image">
                ◀
            </button>

            <span class="viewer-counter" id="viewer-counter">
                1 / 4
            </span>

            <button id="next-image"
                    type="button"
                    aria-label="Next image">
                ▶
            </button>

        </div>

    </div>

    <article class="viewer-information">

        <div class="project-heading">
            <h1>brick by brick</h1>
            <span class="project-year">2024</span>
        </div>

        <div class="project-description">
            <p>serigrafia sobre madeira e blocos de madeira serigrafados, dimensão variada</p>
<p>screen printing on wood and screen printed wood blocks, varied dimensions</p>

        </div>

    </article>

</main>
</body>
</html>
