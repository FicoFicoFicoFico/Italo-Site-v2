
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>time to tidy up — Ítalo Carajá</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/assets/css/project-viewer.css">
    <script src="/assets/js/project-viewer.js" defer></script>
</head>

<body>
<main class="project-viewer">

    <div class="viewer-gallery">

        <div class="viewer-image-area">

            
                <figure class="viewer-slide"
                        data-slide="0"
                        >

                    <img
                        src="/projects/2025/time_to_tidy_up/time_to_tidy_up_2.webp"
                        alt="time to tidy up — image 1"
                        
                            loading="eager"
                        
                    >

                </figure>
            
                <figure class="viewer-slide"
                        data-slide="1"
                        hidden>

                    <img
                        src="/projects/2025/time_to_tidy_up/time_to_tidy_up.webp"
                        alt="time to tidy up — image 2"
                        
                            loading="lazy"
                        
                    >

                </figure>
            

        </div>

        <div class="viewer-controls">

            <button id="previous-image"
                    type="button"
                    aria-label="Previous image">
                ◀
            </button>

            <span class="viewer-counter" id="viewer-counter">
                1 / 2
            </span>

            <button id="next-image"
                    type="button"
                    aria-label="Next image">
                ▶
            </button>

        </div>

    </div>

    <article class="viewer-information">

        <div class="project-heading">
            <h1>time to tidy up</h1>
            <span class="project-year">2025</span>
        </div>

        <div class="project-description">
            <p>time to tidy up, 2025</p>
<p>soldados de plástico, instalação</p>
<p>plastic soldiers, installation</p>

        </div>

    </article>
